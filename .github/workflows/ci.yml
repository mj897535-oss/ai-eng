name: SyntaxLens CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend-quality:
    name: Backend Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: syntaxlens_user
          POSTGRES_PASSWORD: syntaxlens_dev_password_only
          POSTGRES_DB: syntaxlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install pytest pytest-asyncio httpx ruff mypy

      - name: Run Ruff Linter
        run: ruff check apps/api

      - name: Run Mypy Strict Typecheck
        run: mypy --config-file apps/api/pyproject.toml apps/api/app

      - name: Run Backend Unit & Immutability Tests
        run: pytest apps/api/tests -v

      - name: Run Database Migration Up & Down Check
        env:
          DATABASE_URL_SYNC: postgresql+psycopg2://syntaxlens_user:syntaxlens_dev_password_only@localhost:5432/syntaxlens
        run: |
          cd apps/api
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  frontend-quality:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix apps/web install

      - name: Run ESLint
        run: npm --prefix apps/web run lint

      - name: Run TypeScript Strict Typecheck
        run: npm --prefix apps/web run typecheck

      - name: Build Next.js Production Bundle
        run: npm --prefix apps/web run build
